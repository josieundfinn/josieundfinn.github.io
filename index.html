<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine erste Website</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: linear-gradient(135deg, #74ebe1 0%, #d4a5ec 100%); 
            color: #333;
            margin: 0;
            padding: 100px 20px;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        h1 { color: #4a0e4e; }
        p { font-size: 1.1em; color: #555; }
        .button {
            display: inline-block;
            background: #4a0e4e;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
            transition: 0.3s;
        }
        .button:hover { background: #6a1b75; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hallo Welt! 🚀</h1>
        <p>Ich habe diese Website gerade von Grund auf selbst erstellt.</p>
        <p>Gehostet wird das Ganze komplett kostenlos über GitHub Pages.</p>
        <a href="#" class="button">Mehr erfahren</a>
    </div>
</body>
</html>
