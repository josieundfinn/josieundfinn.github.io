<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Adventskalender 2026</title>
    <style>
        body {
            background-color: #722F37; /* Bordeauxrot */
            background-image: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15));
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 1.5rem;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .calendar-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .door {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            transition: background 0.2s;
        }

        .door-header {
            width: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.6rem;
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: background 0.2s;
        }

        .door-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .door-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .door.open .door-icon {
            transform: rotate(180deg);
        }

        .door-content {
            display: none;
            padding: 0 25px 25px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .door.open .door-content {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .door-title {
            font-size: 1.4rem;
            font-style: italic;
            margin-top: 20px;
            margin-bottom: 15px;
            color: #f5e6e8;
        }

        .door-img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 6px;
            margin-top: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .door p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .empty-message {
            font-style: italic;
            opacity: 0.8;
            padding-top: 15px;
            margin-bottom: 0 !important;
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .pdf-link {
            display: inline-block;
            color: #722F37;
            background-color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .pdf-link:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <h1>Adventskalender 2026</h1>
    <div class="subtitle">von Josie & Finn</div>

    <div class="calendar-container" id="calendar"></div>

    <script>
        // =====================================================================
        // HIER TRÄGST DU DIE ÜBERSCHRIFT, DEN DATEINAMEN UND DEN TEXT EIN:
        //   - ueberschrift: Schöne Überschrift im Türchen (z.B. "Die Stille hütet")
        //   - dateiname:    Exakter Name der Dateien ohne Endung (z.B. "DieStilleHütet")
        //                   -> bilder/DATEINAME.jpeg (oder .jpg)
        //                   -> musik/DATEINAME.mp3
        //                   -> Notenblätter/DATEINAME.pdf
        // =====================================================================
        const tuerchenDaten = [
            { tag: 1,  ueberschrift: "Die Stille hütet", dateiname: "DieStilleHütet", text: "Leon und ich waren im März diesen Jahres auf Fahrt in Rumänien. Wir sind mit dem Zug über Wien nach Siebenbürgen gefahren und sind dort Teile des Via Transylvanica gelaufen. Eine Reise durch geschichtsträchtige Ortschaften mit alten Burgen und befestigten Kirchen. Gegen Ende unserer Wanderung kamen wir nach Kreisch, wo wir in der Kreischer Kirchenburg den Burgkastellan Laszlo kennenlernten. Laszlo hat uns durch die Burg geführt und uns abends auf einen geschenkten Schnaps vom Bürgermeister eingeladen. Wir konnte direkt hinter der Burgmauer im Garten der Burganlage übernachten. Am Morgen, an dem wir uns absurd viel Zeit zum Aufbrechen nahmen, haben Leon und ich uns gegenübergesessen. Er schrieb ins Fahrtentagebuch und ich zupfte auf der Gitarre. Große Teile des Textes zu dem Lied und auch die Melodie sind dort entstanden. Erst nach dem Zurückkommen nach Hause habe ich dann die Ideen festgehalten und zu einem Lied zusammengeschnürrt. Leon und ich haben das Lied bisher nicht gemeinsam gesungen, da er nach Norwegen zum Master gegangen ist. Trotzdem habe ich unsere Stimmen gemeinsam im Ohr und den Blick auf die Burg und den tagebuchschreibenden Leon im Kopf wenn ich das Lied höre." },
            { tag: 2,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 3,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 4,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 5,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 6,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 7,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 8,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 9,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 10, ueberschrift: "", dateiname: "", text: "" },
            { tag: 11, ueberschrift: "", dateiname: "", text: "" },
            { tag: 12, ueberschrift: "", dateiname: "", text: "" },
            { tag: 13, ueberschrift: "", dateiname: "", text: "" },
            { tag: 14, ueberschrift: "", dateiname: "", text: "" },
            { tag: 15, ueberschrift: "", dateiname: "", text: "" },
            { tag: 16, ueberschrift: "", dateiname: "", text: "" },
            { tag: 17, ueberschrift: "", dateiname: "", text: "" },
            { tag: 18, ueberschrift: "", dateiname: "", text: "" },
            { tag: 19, ueberschrift: "", dateiname: "", text: "" },
            { tag: 20, ueberschrift: "", dateiname: "", text: "" },
            { tag: 21, ueberschrift: "", dateiname: "", text: "" },
            { tag: 22, ueberschrift: "", dateiname: "", text: "" },
            { tag: 23, ueberschrift: "", dateiname: "", text: "" },
            { tag: 24, ueberschrift: "", dateiname: "", text: "" }
        ];

        // =====================================================================
        // AB HIER NICHTS MEHR ÄNDERN
        // =====================================================================
        const calendarContainer = document.getElementById('calendar');

        function handleImageError(imgElement, encodedDatei) {
            if (!imgElement.dataset.triedJpg) {
                imgElement.dataset.triedJpg = 'true';
                imgElement.src = `bilder/${encodedDatei}.jpg`;
            } else {
                imgElement.style.display = 'none';
            }
        }

        tuerchenDaten.forEach(eintrag => {
            const doorDiv = document.createElement('div');
            doorDiv.className = 'door';

            const datei = (eintrag.dateiname || '').trim();
            const ueberschrift = (eintrag.ueberschrift || '').trim() || datei;
            const text = (eintrag.text || '').trim();
            const hatInhalt = Boolean(ueberschrift || datei || text);

            let inhaltHTML = '';

            if (!hatInhalt) {
                inhaltHTML = `<p class="empty-message">Dieses Türchen ist noch nicht befüllt. Schau am ${eintrag.tag}. Dezember wieder vorbei! 🎄</p>`;
            } else {
                if (ueberschrift) {
                    inhaltHTML += `<div class="door-title">${ueberschrift}</div>`;
                }

                if (datei) {
                    const encodedDatei = encodeURIComponent(datei);
                    inhaltHTML += `
                        <img
                            src="bilder/${encodedDatei}.jpeg"
                            alt="Bild zum Lied ${ueberschrift}"
                            class="door-img"
                            loading="lazy"
                            onerror="handleImageError(this, '${encodedDatei}')"
                        >
                        <audio controls preload="none" src="musik/${encodedDatei}.mp3">
                            Ihr Browser unterstützt das Audio-Element nicht.
                        </audio><br>
                        <a href="Notenblätter/${encodedDatei}.pdf" target="_blank" class="pdf-link">📄 Liedblatt öffnen (PDF)</a>
                    `;
                }

                if (text) {
                    inhaltHTML += `<p>${text}</p>`;
                }
            }

            doorDiv.innerHTML = `
                <button class="door-header" type="button">
                    <span>${eintrag.tag}. Dezember</span>
                    <span class="door-icon">▼</span>
                </button>
                <div class="door-content">
                    ${inhaltHTML}
                </div>
            `;

            const headerBtn = doorDiv.querySelector('.door-header');
            headerBtn.addEventListener('click', () => {
                const warOffen = doorDiv.classList.contains('open');
                doorDiv.classList.toggle('open');

                if (warOffen) {
                    const audio = doorDiv.querySelector('audio');
                    if (audio) audio.pause();
                }
            });

            calendarContainer.appendChild(doorDiv);
        });
    </script>

</body>
</html>
