<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adventskalender 2026</title>
    <style>
        body {
            background-color: #722F37; /* Bordeauxrot */
            background-image: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15)); /* Leicht ausgeblichen */
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 1.5rem;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .calendar-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .door {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            padding: 25px;
            text-align: center;
        }

        .door h2 {
            font-size: 1.8rem;
            margin-top: 0;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 5px;
        }

        .door p {
            font-size: 1.1rem;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .pdf-link {
            display: inline-block;
            color: #722F37;
            background-color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .pdf-link:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <h1>Adventskalender 2026</h1>
    <div class="subtitle">von Josie & Finn</div>

    <div class="calendar-container">

        <!-- 1. DEZEMBER -->
        <div class="door">
            <h2>1. Dezember</h2>
            <p>Hallo und herzlich willkommen zu unserem musikalischen Adventskalender! Zum Start haben wir für euch ein schönes erstes Lied aufgenommen. Viel Spaß beim Anhören und Mitsingen!</p>
            
            <!-- Musikdatei im Ordner "musik" -->
            <audio controls src="musik/tag1_bachlauf.mp3">
                Ihr Browser unterstützt das Audio-Element nicht.
            </audio>
            
            <br>
            <!-- PDF-Datei im Ordner "noten" -->
            <a href="noten/tag1_bachlauf.pdf" target="_blank" class="pdf-link">📄 Liedblatt öffnen (PDF)</a>
        </div>

    </div>

</body>
</html>
