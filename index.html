<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Adventskalender 2026</title>
    <style>
        body {
            background-color: #722F37; /* Bordeauxrot */
            background-image: linear-gradient(rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.15));
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            margin: 0;
            padding: 40px 20px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            font-weight: normal;
        }

        .subtitle {
            font-size: 1.5rem;
            font-style: italic;
            margin-top: 0;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .calendar-container {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .door {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            overflow: hidden;
            transition: background 0.2s;
        }

        .door.locked {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.18);
        }

        .door-header {
            width: 100%;
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.6rem;
            padding: 18px 25px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
            transition: background 0.2s;
        }

        .door-header:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .door.locked .door-header {
            opacity: 0.75;
        }

        .door-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .door.open .door-icon {
            transform: rotate(180deg);
        }

        .door-content {
            display: none;
            padding: 0 25px 25px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .door.open .door-content {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .door-title {
            font-size: 1.4rem;
            font-style: italic;
            margin-top: 20px;
            margin-bottom: 15px;
            color: #f5e6e8;
        }

        .door-gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 15px;
            margin-bottom: 18px;
        }

        .door-img {
            width: 100%;
            max-width: 400px;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .door p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .empty-message, .locked-message {
            font-style: italic;
            opacity: 0.85;
            padding-top: 15px;
            margin-bottom: 0 !important;
        }

        audio {
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .pdf-link {
            display: inline-block;
            color: #722F37;
            background-color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            font-family: sans-serif;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .pdf-link:hover {
            background-color: #e0e0e0;
        }
    </style>
</head>
<body>

    <h1>Adventskalender 2026</h1>
    <div class="subtitle">von Josie & Finn</div>

    <div class="calendar-container" id="calendar"></div>

    <script>
        // =====================================================================
        // HIER TRÄGST DU DIE ÜBERSCHRIFT, DEN DATEINAMEN UND DEN TEXT EIN:
        //   - ueberschrift: Schöne Überschrift im Türchen (z.B. "Die Stille hütet")
        //   - dateiname:    Exakter Name der Dateien ohne Endung (z.B. "DieStilleHütet")
        //                   -> bilder/DATEINAME.jpeg (oder .jpg)
        //                   -> weitere Bilder optional: DATEINAME_2.jpeg, DATEINAME_3.jpeg ...
        //                   -> musik/DATEINAME.mp3
        //                   -> Notenblätter/DATEINAME.pdf
        // =====================================================================
        const tuerchenDaten = [
            { tag: 1,  ueberschrift: "Ein Gefühl von Frei", dateiname: "EinGefühlVonFrei", text: "" },
            { tag: 2,  ueberschrift: "Der Löffel & Du", dateiname: "DerLöffel&Du", text: "Der Löffeltest... überall bekannt und allseits beliebt. Ziel des Tests ist es herauszufinden wer einen Löffel direkt griffbereit hat und wer nicht. Wer keinen Löffel vorzeigen kann muss eine peinliche oder lustige Bestrafung machen. Seit dieses Tests in meiner Sippenzeit und weil ein Löffel auch einfach immer praktisch ist, habe ich oft einen Löffel griffbereit. Gerade auf Fahrt oder auf Lagern. Meistens ist es ein Holzlöffel, nicht selbst geschnitzt, nicht besonders groß, nicht unbedingt schick und perfekt geformt. Aber er wohnt halt in der Zunfthose und ist deswegen immer mit dabei. Mit diesem Löffel, den Gedanken wofür er steht, warum ich ihn dabei habe, ihn ausleihe und mit der Lust mal etwas im Elemt of Crime Stil zu schreiben, ist dieses Lied im Herbst 2026 entstanden.    -finn " },
            { tag: 3,  ueberschrift: "Katzen auf Sofas", dateiname: "KatzenAufSofas", text: "" },
            { tag: 4,  ueberschrift: "Die Reise", dateiname: "DieReise", text: "" },
            { tag: 5,  ueberschrift: "Frühlingsmelancholie", dateiname: "Frühlingsmelancholie", text: "" },
            { tag: 6,  ueberschrift: "Odessa bis Bukarest", dateiname: "OdessaBisBukarest", text: "" },
            { tag: 7,  ueberschrift: "Brokenheart", dateiname: "Brokenheart", text: "" },
            { tag: 8,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 9,  ueberschrift: "", dateiname: "", text: "" },
            { tag: 10, ueberschrift: "", dateiname: "", text: "" },
            { tag: 11, ueberschrift: "", dateiname: "", text: "" },
            { tag: 12, ueberschrift: "", dateiname: "", text: "" },
            { tag: 13, ueberschrift: "", dateiname: "", text: "" },
            { tag: 14, ueberschrift: "", dateiname: "", text: "" },
            { tag: 15, ueberschrift: "", dateiname: "", text: "" },
            { tag: 16, ueberschrift: "", dateiname: "", text: "" },
            { tag: 17, ueberschrift: "Abendweise", dateiname: "", text: "" },
            { tag: 18, ueberschrift: "", dateiname: "", text: "" },
            { tag: 19, ueberschrift: "", dateiname: "", text: "" },
            { tag: 20, ueberschrift: "", dateiname: "", text: "" },
            { tag: 21, ueberschrift: "", dateiname: "", text: "" },
            { tag: 22, ueberschrift: "", dateiname: "", text: "" },
            { tag: 23, ueberschrift: "", dateiname: "", text: "" },
            { tag: 24, ueberschrift: "", dateiname: "", text: "" }
        ];

        // =====================================================================
        // AB HIER NICHTS MEHR ÄNDERN
        // =====================================================================
        const MAX_BILDER_PRO_LIED = 8; // Bei Bedarf einfach erhöhen (z.B. auf 12)
        const calendarContainer = document.getElementById('calendar');

        const urlParams = new URLSearchParams(window.location.search);
        const istVorschau = urlParams.get('vorschau') === '1';

        function istTagFreigeschaltet(tagNummer) {
            if (istVorschau) return true;

            const jetzt = new Date();
            const jahr = jetzt.getFullYear();
            const monat = jetzt.getMonth(); // 0 = Januar ... 11 = Dezember
            const tag = jetzt.getDate();

            if (jahr > 2026) return true;
            if (jahr < 2026 || monat < 11) return false;

            return tag >= tagNummer;
        }

        function handleImageError(imgElement, encodedBasisName) {
            if (!imgElement.dataset.triedJpg) {
                imgElement.dataset.triedJpg = 'true';
                imgElement.src = `bilder/${encodedBasisName}.jpg`;
            } else {
                imgElement.style.display = 'none';
            }
        }

        function baueBilderGalerieHTML(datei, ueberschrift) {
            const encodedDatei = encodeURIComponent(datei);
            let bilderHTML = '<div class="door-gallery">';

            for (let nr = 1; nr <= MAX_BILDER_PRO_LIED; nr++) {
                const suffix = nr === 1 ? '' : `_${nr}`;
                const basisName = `${datei}${suffix}`;
                const encodedBasis = encodeURIComponent(basisName);

                bilderHTML += `
                    <img
                        src="bilder/${encodedBasis}.jpeg"
                        alt="Bild ${nr} zum Lied ${ueberschrift}"
                        class="door-img"
                        loading="lazy"
                        onerror="handleImageError(this, '${encodedBasis}')"
                    >
                `;
            }

            bilderHTML += '</div>';
            return bilderHTML;
        }

        tuerchenDaten.forEach(eintrag => {
            const doorDiv = document.createElement('div');
            doorDiv.className = 'door';

            const freigeschaltet = istTagFreigeschaltet(eintrag.tag);
            const datei = (eintrag.dateiname || '').trim();
            const ueberschrift = (eintrag.ueberschrift || '').trim() || datei;
            const text = (eintrag.text || '').trim();
            const hatInhalt = Boolean(ueberschrift || datei || text);

            let inhaltHTML = '';

            if (!freigeschaltet) {
                doorDiv.classList.add('locked');
                inhaltHTML = `<p class="locked-message">Dieses Türchen öffnet sich erst am ${eintrag.tag}. Dezember 2026. 🕯️</p>`;
            } else if (!hatInhalt) {
                inhaltHTML = `<p class="empty-message">Dieses Türchen ist noch nicht befüllt. Schau am ${eintrag.tag}. Dezember wieder vorbei! 🎄</p>`;
            } else {
                if (ueberschrift) {
                    inhaltHTML += `<div class="door-title">${ueberschrift}</div>`;
                }

                if (datei) {
                    const encodedDatei = encodeURIComponent(datei);
                    inhaltHTML += baueBilderGalerieHTML(datei, ueberschrift);
                    inhaltHTML += `
                        <audio controls preload="none" src="musik/${encodedDatei}.mp3">
                            Ihr Browser unterstützt das Audio-Element nicht.
                        </audio><br>
                        <a href="Notenblätter/${encodedDatei}.pdf" target="_blank" class="pdf-link">📄 Liedblatt öffnen (PDF)</a>
                    `;
                }

                if (text) {
                    inhaltHTML += `<p>${text}</p>`;
                }
            }

            const statusSymbol = freigeschaltet ? '▼' : '🔒';

            doorDiv.innerHTML = `
                <button class="door-header" type="button">
                    <span>${eintrag.tag}. Dezember</span>
                    <span class="door-icon">${statusSymbol}</span>
                </button>
                <div class="door-content">
                    ${inhaltHTML}
                </div>
            `;

            const headerBtn = doorDiv.querySelector('.door-header');
            headerBtn.addEventListener('click', () => {
                const warOffen = doorDiv.classList.contains('open');
                doorDiv.classList.toggle('open');

                if (warOffen) {
                    const audio = doorDiv.querySelector('audio');
                    if (audio) audio.pause();
                }
            });

            calendarContainer.appendChild(doorDiv);
        });
    </script>

</body>
</html>
